spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/kcalorix
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

app.cors.allowed-origins=http://localhost:3000
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=CALORIX_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

usda.api-key=${USDA_API_KEY}
usda.base-url=https://api.nal.usda.gov/fdc/v1
gemini.api-key=${GEMINI_API_KEY}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-3.5-flash-lite
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
calorix.exercise-credit=1.0
calorix.notifications.scan-delay-ms=60000
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
brevo.sender-name=Calorix
brevo.reply-to-email=${SUPPORT_EMAIL}
app.frontend-url=http://localhost:3000
app.email.logo-url=${APP_BASE_URL}/logo.png

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.error.include-stacktrace=never
server.error.include-message=never
logging.pattern.level=%5p [%X{requestId}]

